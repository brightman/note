apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanobot-control-plane
  labels:
    app: nanobot-control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nanobot-control-plane
  template:
    metadata:
      labels:
        app: nanobot-control-plane
    spec:
      containers:
        - name: control-plane
          image: nanobot-cloud/control-plane:latest
          ports:
            - containerPort: 8000
          env:
            - name: NC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nanobot-secrets
                  key: database-url
            - name: NC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nanobot-secrets
                  key: jwt-secret
            - name: NC_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: nanobot-secrets
                  key: encryption-key
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: nanobot-control-plane
spec:
  selector:
    app: nanobot-control-plane
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nanobot-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nanobot-control-plane
                port:
                  number: 80
