version: "3.9"

# Integration test stack — uses isolated ports to coexist with dev stack.
# postgres  → localhost:5433
# minio     → localhost:9002
# No control-plane container: server is started by pytest as a subprocess.

services:

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nanobot
      POSTGRES_PASSWORD: nanobot
      POSTGRES_DB: nanobot_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data    # in-memory for speed, wiped on down
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanobot"]
      interval: 2s
      timeout: 2s
      retries: 20

  minio-test:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20
