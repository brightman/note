version: "3.9"

# Local development stack.
# NOTE: Firecracker requires /dev/kvm — this compose file runs the control
# plane services only. On a KVM-capable host, add the vm-host service.

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nanobot
      POSTGRES_PASSWORD: nanobot
      POSTGRES_DB: nanobot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanobot"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  control-plane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.control-plane
    environment:
      NC_DATABASE_URL: "postgresql+asyncpg://nanobot:nanobot@postgres:5432/nanobot"
      NC_DATABASE_URL_SYNC: "postgresql://nanobot:nanobot@postgres:5432/nanobot"
      NC_S3_ENDPOINT: "http://minio:9000"
      NC_S3_BUCKET: "nanobot-data"
      NC_S3_ACCESS_KEY: "minioadmin"
      NC_S3_SECRET_KEY: "minioadmin"
      NC_JWT_SECRET: "dev-secret-change-in-prod"
      NC_ENCRYPTION_KEY: "dev-enc-key-32-bytes-padded-here"
      # Firecracker paths (populated by vm-host volume mounts)
      NC_FC_BINARY: "/usr/bin/firecracker"
      NC_FC_KERNEL: "/opt/fc-kernels/vmlinux"
      NC_FC_ROOTFS: "/opt/fc-images/nanobot-rootfs.ext4"
      NC_FC_API_SOCK_DIR: "/tmp/fc-api"
      NC_FC_VSOCK_DIR: "/tmp/fc-vsock"
      NC_VM_IDLE_TIMEOUT: "1800"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # KVM access for Firecracker (requires privileged host)
    devices:
      - /dev/kvm:/dev/kvm
    cap_add:
      - NET_ADMIN
    volumes:
      - /opt/fc-images:/opt/fc-images:ro
      - /opt/fc-kernels:/opt/fc-kernels:ro
      - /tmp/fc-api:/tmp/fc-api
      - /tmp/fc-vsock:/tmp/fc-vsock

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.control-plane
    command: >
      alembic -c migrations/alembic.ini upgrade head
    environment:
      NC_DATABASE_URL: "postgresql+asyncpg://nanobot:nanobot@postgres:5432/nanobot"
      NC_DATABASE_URL_SYNC: "postgresql://nanobot:nanobot@postgres:5432/nanobot"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  minio_data:
